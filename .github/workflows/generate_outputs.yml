name: Generate Model Outputs

on:
  push:
    paths:
      - "scorecard_pipeline.py"
      - "requirements.txt"
      - ".github/workflows/generate_outputs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scorecard pipeline
        run: python scorecard_pipeline.py

      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/*.png outputs/*.csv
          git diff --cached --quiet || git commit -m "Refresh model outputs"
          git pull --rebase origin main
          git push
