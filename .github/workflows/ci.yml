name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Unit tests (metrics, binning, scorecard maths, API)
        run: pytest -q
      - name: Smoke-run the benchmark on a reduced grid
        run: FAST=1 python experiments/run_benchmark.py german

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the scoring image
        run: docker build -f service/Dockerfile -t credit-scoring .
      - name: Start it and score one applicant
        run: |
          docker run -d -p 8080:8080 --name api credit-scoring
          for i in $(seq 1 20); do curl -sf localhost:8080/health && break; sleep 1; done
          python - <<'PY'
          import json, urllib.request
          ex = json.load(open("service/model/schema.json"))["example"]
          ex = {k: v for k, v in ex.items() if not k.startswith(("utilisation", "pay_ratio", "months_", "max_"))}
          req = urllib.request.Request("http://localhost:8080/v1/score", json.dumps({"applicants": [ex]}).encode(),
                                       {"Content-Type": "application/json"})
          print(urllib.request.urlopen(req).read().decode())
          PY
